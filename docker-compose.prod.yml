# Dcode production compose stack.
# Public surface: frontend only. The nginx frontend proxies `/api/*` to the
# internal API service, so the browser never needs direct access to api:8000.

services:
  postgres:
    image: pgvector/pgvector:pg15
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?set POSTGRES_USER in .env.production}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env.production}
      POSTGRES_DB: ${POSTGRES_DB:?set POSTGRES_DB in .env.production}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./infra/postgres/init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-dcode}"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:?set RABBITMQ_USER in .env.production}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:?set RABBITMQ_PASSWORD in .env.production}
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 10s
      retries: 20
    restart: unless-stopped

  api:
    build:
      context: .
      dockerfile: infra/docker/api.Dockerfile
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:?set POSTGRES_USER in .env.production}:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env.production}@postgres:5432/${POSTGRES_DB:?set POSTGRES_DB in .env.production}
      REDIS_URL: redis://redis:6379/0
      RABBITMQ_URL: amqp://${RABBITMQ_USER:?set RABBITMQ_USER in .env.production}:${RABBITMQ_PASSWORD:?set RABBITMQ_PASSWORD in .env.production}@rabbitmq:5672/
      AGENT_URL: http://agent:8001
      CORS_ORIGINS: ${PUBLIC_ORIGIN:-http://dcode.odieyang.com}
      INTERNAL_API_KEY: ${INTERNAL_API_KEY:?set INTERNAL_API_KEY in .env.production}
      # The API embeds the query and reranks candidates at search time, so it
      # needs the same retrieval configuration as the worker — not a subset.
      # It is also where `make prod-migrate` runs, and the migration reads
      # EMBEDDING_DIM to size the pgvector column.
      EMBEDDING_MODEL: ${EMBEDDING_MODEL:-stub}
      EMBEDDING_DIM: ${EMBEDDING_DIM:?set EMBEDDING_DIM in .env.production — it is fixed into the pgvector column at migration time and cannot be changed without a new volume}
      EMBEDDING_ENDPOINT: ${EMBEDDING_ENDPOINT:-}
      EMBEDDING_BATCH_SIZE: ${EMBEDDING_BATCH_SIZE:-4}
      EMBEDDING_MAX_RETRIES: ${EMBEDDING_MAX_RETRIES:-12}
      EMBEDDING_TIMEOUT_SECONDS: ${EMBEDDING_TIMEOUT_SECONDS:-300}
      EMBEDDING_PROVIDER: ${EMBEDDING_PROVIDER:-sidecar}
      EMBEDDING_API_KEY: ${EMBEDDING_API_KEY:-}
      RRF_DENSE_WEIGHT: ${RRF_DENSE_WEIGHT:-2.0}
      RRF_SPARSE_WEIGHT: ${RRF_SPARSE_WEIGHT:-1.0}
      RERANKER_MODEL: ${RERANKER_MODEL:-stub}
      RERANKER_ENDPOINT: ${RERANKER_ENDPOINT:-}
      RERANKER_CANDIDATE_LIMIT: ${RERANKER_CANDIDATE_LIMIT:-16}
      RERANKER_MAX_RETRIES: ${RERANKER_MAX_RETRIES:-3}
      RERANKER_PROVIDER: ${RERANKER_PROVIDER:-sidecar}
      RERANKER_API_KEY: ${RERANKER_API_KEY:-}
      # The gate is HARDCODED on, not defaulted. A production deployment that
      # can be talked out of authenticating by omitting a variable is not a
      # gate. The API refuses to start if the credential or secret is missing,
      # so this fails loudly rather than serving the workbench openly.
      AUTH_ENABLED: "true"
      AUTH_USERNAME: ${AUTH_USERNAME:?set AUTH_USERNAME in .env.production}
      AUTH_PASSWORD_HASH: ${AUTH_PASSWORD_HASH:?set AUTH_PASSWORD_HASH in .env.production — generate with `python -m dcode_api.hash_password`}
      AUTH_SESSION_SECRET: ${AUTH_SESSION_SECRET:?set AUTH_SESSION_SECRET in .env.production — at least 32 characters}
      AUTH_SESSION_TTL_SECONDS: ${AUTH_SESSION_TTL_SECONDS:-43200}
      AUTH_COOKIE_SECURE: ${AUTH_COOKIE_SECURE:-true}
      AUTH_DAILY_QUERY_LIMIT: ${AUTH_DAILY_QUERY_LIMIT:-200}
      # /docs, /redoc and /openapi.json enumerate the /internal/* surface.
      DOCS_ENABLED: "false"
      LOG_LEVEL: ${LOG_LEVEL:-info}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8000/healthz').status==200 else 1)\""]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  worker:
    build:
      context: .
      dockerfile: infra/docker/worker.Dockerfile
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:?set POSTGRES_USER in .env.production}:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env.production}@postgres:5432/${POSTGRES_DB:?set POSTGRES_DB in .env.production}
      REDIS_URL: redis://redis:6379/0
      RABBITMQ_URL: amqp://${RABBITMQ_USER:?set RABBITMQ_USER in .env.production}:${RABBITMQ_PASSWORD:?set RABBITMQ_PASSWORD in .env.production}@rabbitmq:5672/
      EMBEDDING_MODEL: ${EMBEDDING_MODEL:-stub}
      EMBEDDING_DIM: ${EMBEDDING_DIM:?set EMBEDDING_DIM in .env.production — it must equal the dimension the volume was migrated at}
      EMBEDDING_ENDPOINT: ${EMBEDDING_ENDPOINT:-}
      EMBEDDING_BATCH_SIZE: ${EMBEDDING_BATCH_SIZE:-4}
      EMBEDDING_MAX_RETRIES: ${EMBEDDING_MAX_RETRIES:-12}
      EMBEDDING_TIMEOUT_SECONDS: ${EMBEDDING_TIMEOUT_SECONDS:-300}
      EMBEDDING_PROVIDER: ${EMBEDDING_PROVIDER:-sidecar}
      EMBEDDING_API_KEY: ${EMBEDDING_API_KEY:-}
      WORKDIR_BASE: /tmp/dcode-workdirs
      INTERNAL_API_KEY: ${INTERNAL_API_KEY:?set INTERNAL_API_KEY in .env.production}
      LOG_LEVEL: ${LOG_LEVEL:-info}
    volumes:
      - repo_workdirs:/tmp/dcode-workdirs
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "print('ok')"]
      interval: 30s
      timeout: 5s
      retries: 3
    restart: unless-stopped

  agent:
    build:
      context: .
      dockerfile: infra/docker/agent.Dockerfile
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:?set POSTGRES_USER in .env.production}:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env.production}@postgres:5432/${POSTGRES_DB:?set POSTGRES_DB in .env.production}
      REDIS_URL: redis://redis:6379/0
      JUDGE_MODEL: ${JUDGE_MODEL:-stub}
      GROUNDEDNESS_THRESHOLD: ${GROUNDEDNESS_THRESHOLD:-0.95}
      SYNTHESIS_MODEL: ${SYNTHESIS_MODEL:-stub}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_BASE_URL: ${OPENAI_BASE_URL:-}
      SYNTHESIS_MAX_TOKENS: ${SYNTHESIS_MAX_TOKENS:-700}
      SYNTHESIS_TEMPERATURE: ${SYNTHESIS_TEMPERATURE:-0.1}
      # The agent reranks its own evidence union, so it needs the reranker
      # configuration too — RERANKER_ENDPOINT alone selected nothing, because
      # a stub RERANKER_MODEL returns no client regardless of the endpoint.
      RERANKER_MODEL: ${RERANKER_MODEL:-stub}
      RERANKER_ENDPOINT: ${RERANKER_ENDPOINT:-}
      RERANKER_MAX_RETRIES: ${RERANKER_MAX_RETRIES:-3}
      RERANKER_PROVIDER: ${RERANKER_PROVIDER:-sidecar}
      RERANKER_API_KEY: ${RERANKER_API_KEY:-}
      # Not read directly by the agent, but dcode_shared.db.models binds the
      # chunks.embedding column type to it at import time.
      EMBEDDING_DIM: ${EMBEDDING_DIM:?set EMBEDDING_DIM in .env.production — it must equal the dimension the volume was migrated at}
      # Deploy.md R-2. A budget that expires inside the platform's request
      # limit, and comment frames so a slow answer is not read as an idle
      # connection.
      AGENT_REQUEST_BUDGET_SECONDS: ${AGENT_REQUEST_BUDGET_SECONDS:-240}
      SSE_HEARTBEAT_SECONDS: ${SSE_HEARTBEAT_SECONDS:-20}
      RETRIEVAL_BASE_URL: http://api:8000
      WORKDIR_BASE: /tmp/dcode-workdirs
      INTERNAL_API_KEY: ${INTERNAL_API_KEY:?set INTERNAL_API_KEY in .env.production}
      LOG_LEVEL: ${LOG_LEVEL:-info}
    volumes:
      - repo_workdirs:/tmp/dcode-workdirs
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8001/healthz').status==200 else 1)\""]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  frontend:
    build:
      context: ./apps/frontend
      dockerfile: ../../infra/docker/frontend.Dockerfile
      args:
        VITE_API_BASE_URL: ""
    ports:
      - "${PUBLIC_HTTP_PORT:-80}:80"
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://127.0.0.1/healthz"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 5s
    restart: unless-stopped

volumes:
  postgres_data:
  repo_workdirs:
